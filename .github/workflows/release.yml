name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the tag matches VERSION
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION (expected $want)" >&2
            exit 1
          fi

      # Builds every target (running the tests on the native one) and
      # produces the tarballs, SHA256SUMS and the Homebrew formula.
      - name: Build
        run: |
          nix flake check -L
          nix build .#release -L

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" result/*.tar.gz result/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not set" >&2
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jondoveston/homebrew-tap.git" tap
          mkdir -p tap/Formula
          install -m 644 result/password-cleaner.rb tap/Formula/password-cleaner.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/password-cleaner.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "password-cleaner $GITHUB_REF_NAME"
          git push

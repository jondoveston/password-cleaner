name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Runs the tests, and proves every release target builds and the
      # Homebrew formula generates.
      - name: nix flake check
        run: nix flake check -L

      - name: Format, vet and lint
        run: nix develop --command task fmt:check vet lint
